[project]
name = "{{slug}}"
version = "0.1.0"
description = "{{title}} — an MCP App (FastMCP server + React UI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.5",
]

[project.scripts]
{{slug}} = "{{pyPackage}}.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["{{pyPackage}}"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
